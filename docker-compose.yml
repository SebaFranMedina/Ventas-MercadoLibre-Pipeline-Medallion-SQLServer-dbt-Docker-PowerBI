services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
  pipeline:
    build: .
    depends_on:
      - sqlserver
    env_file: .env
    environment:
      INPUT_FILE: ${INPUT_FILE:-data/sample/sample_sales.xlsx}
    volumes:
      - ./data:/app/data
      - ./dbt:/app/dbt
volumes:
  mssql_data:
