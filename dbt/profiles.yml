ml_ventas:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '1433') | as_number }}"
      database: "{{ env_var('MSSQL_DB', 'ventas_ml') }}"
      schema: dbo
      authentication: sql
      user: "{{ env_var('DB_USER', 'sa') }}"
      password: "{{ env_var('MSSQL_SA_PASSWORD') }}"
      encrypt: true
      trust_cert: true      # local dev container uses a self-signed certificate
      threads: 4
